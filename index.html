<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CNC</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #ffffff;
        }

        #appFrame {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border: none;
            margin: 0;
            padding: 0;

            display: block;
        }
    </style>
</head>

<body>

    <iframe
        id="appFrame"
        src="https://script.google.com/macros/s/AKfycbwPQZwmXDNOulFJb6evUjPA85N7nkb125cQrIAInScoZTbvwetPLkY_O_plmgU9b0zwcw/exec"
        scrolling="yes"
        frameborder="0"
        allow="clipboard-read; clipboard-write">
    </iframe>


    <script>

        /*
        ===========================================
        CNC - Google Apps Script Wrapper
        ===========================================
        */

        const GAS_URL =
        "https://script.google.com/macros/s/AKfycbwPQZwmXDNOulFJb6evUjPA85N7nkb125cQrIAInScoZTbvwetPLkY_O_plmgU9b0zwcw/exec";


        /*
        -------------------------------------------
        เปลี่ยนหน้า Apps Script ภายใน iframe
        -------------------------------------------
        */

        function navigateTo(page) {

            const frame =
                document.getElementById("appFrame");

            if (!page) {
                frame.src = GAS_URL;
                return;
            }

            frame.src =
                GAS_URL +
                "?page=" +
                encodeURIComponent(page);
        }


        /*
        -------------------------------------------
        รับคำสั่งจาก Apps Script
        -------------------------------------------
        */

        window.addEventListener(
            "message",
            function(event) {

                if (!event.data) return;

                /*
                Apps Script ส่ง:
                
                window.top.postMessage({
                    type: "NAVIGATE",
                    page: "Dashboard"
                }, "*");
                */

                if (
                    event.data.type === "NAVIGATE"
                ) {

                    navigateTo(
                        event.data.page
                    );

                }


                /*
                Logout
                */

                if (
                    event.data.type === "LOGOUT"
                ) {

                    navigateTo("");

                }

            }
        );


        /*
        -------------------------------------------
        ป้องกัน iframe สูงเกิน/ต่ำเกินหน้าจอ
        -------------------------------------------
        */

        function resizeFrame() {

            const frame =
                document.getElementById("appFrame");

            frame.style.height =
                window.innerHeight + "px";
        }


        window.addEventListener(
            "resize",
            resizeFrame
        );

        resizeFrame();

    </script>

</body>
</html>
