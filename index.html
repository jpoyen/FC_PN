<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>CNC - FC PN</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#fff; }
    #appFrame { position:fixed; inset:0; width:100%; height:100dvh; border:0; display:block; }
  </style>
</head>
<body>
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwPQZwmXDNOulFJb6evUjPA85N7nkb125cQrIAInScoZTbvwetPLkY_O_plmgU9b0zwcw/exec"
    scrolling="yes"
    frameborder="0"
    allow="clipboard-read; clipboard-write">
  </iframe>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwPQZwmXDNOulFJb6evUjPA85N7nkb125cQrIAInScoZTbvwetPLkY_O_plmgU9b0zwcw/exec';
    const frame = document.getElementById('appFrame');

    function navigateTo(page) {
      frame.src = page ? `${GAS_URL}?page=${encodeURIComponent(page)}` : GAS_URL;
    }

    window.addEventListener('message', (event) => {
      // รับเฉพาะข้อความจากหน้า Google Apps Script / googleusercontent
      const okOrigin = event.origin === 'https://script.google.com' ||
                       event.origin.endsWith('.googleusercontent.com');
      if (!okOrigin || !event.data || typeof event.data !== 'object') return;

      if (event.data.type === 'NAVIGATE' && event.data.page) {
        navigateTo(event.data.page);
      } else if (event.data.type === 'LOGOUT') {
        navigateTo(null);
      }
    });
  </script>
</body>
</html>
